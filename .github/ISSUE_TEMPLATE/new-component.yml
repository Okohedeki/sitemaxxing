name: New component
description: Propose a component with variants
labels: [component]
body:
  - type: input
    id: name
    attributes:
      label: Component name
    validations:
      required: true
  - type: textarea
    id: variants
    attributes:
      label: The three variants
      description: A sentence per variant. Everything must be original work.
    validations:
      required: true
  - type: textarea
    id: motion
    attributes:
      label: Motion and reduced motion behavior
