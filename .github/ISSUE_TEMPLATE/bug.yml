name: Bug report
description: Something broke
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sitemaxxing version
      placeholder: 0.1.0
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: macOS 15 / Node 22
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `sitemaxxing dev` or the browser console, if relevant.
      render: shell
